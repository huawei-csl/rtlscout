# Rehearsal for fpadd.yaml: same benchmark, top module, ports and phase shape,
# scaled down so a full end-to-end pass (stage 0 -> P1 -> P2 -> fronts -> P4
# refine + from-scratch -> table/figure) finishes in minutes. Use it to validate
# plumbing after a profile or harness change; the numbers are not meaningful.
tag: fpadd-smoke
model: openrouter:z-ai/glm-5.2

benchmarks:
  spirehdl: fpadd_f16

top_module: fp_add_e5f10
ports:
  inputs: "a:16,b:16"
  outputs: "y:16"

agent:
  max_steps: 10           # 3 was too few: the agent spent them reading and never called run_evaluation
  elite_size: 2
  target_delay: 1400.0

campaigns_p1:
  - {name: area,  metric: area,  runs: 2, concurrent: 2, fresh_first: 1}
  - {name: delay, metric: delay, runs: 2, concurrent: 2, fresh_first: 1}
  - {name: adp,   metric: area_delay_product, runs: 2, concurrent: 2, fresh_first: 1}
campaigns_p2:
  - {name: area,  metric: area,  runs: 2, concurrent: 2, fresh_first: 0,
     fresh_base: 0.0, fresh_min: 0.0, seed_from: area}
  - {name: delay, metric: delay, runs: 2, concurrent: 2, fresh_first: 0,
     fresh_base: 0.0, fresh_min: 0.0, seed_from: delay}
  - {name: adp,   metric: area_delay_product, runs: 2, concurrent: 2, fresh_first: 0,
     fresh_base: 0.0, fresh_min: 0.0, seed_from: adp}

front:
  n_points: 2

deepsyn:
  time_budget: 20           # seconds per trajectory -- rehearsal only
  refine_runs: 2
  workers: 8
  double_effort: false

eval:
  target_delays: [900.0, 1400.0, 2200.0]
  workers: 8
